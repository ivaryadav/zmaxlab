    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />

      {"@type":"WebSite","@id":"https://zmaxlab.site/#site","url":"https://zmaxlab.site",
       "name":"ZmaxLab","publisher":{"@id":"https://zmaxlab.site/#org"},

      {"@type":"ProfessionalService","@id":"https://zmaxlab.site/#service",
       "name":"ZmaxLab Healthcare Web Design","url":"https://zmaxlab.site",

  </body>
</html>
